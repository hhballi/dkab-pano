<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>DKAB Ders Panosu</title><style>
:root{--bg:#f6f4ef;--kart:#ffffff;--yazi:#1f2a37;--soluk:#5b6675;--vurgu:#0f6b5c;--cizgi:#e2ddd2}
@media (prefers-color-scheme:dark){:root{--bg:#141a21;--kart:#1d2630;--yazi:#eef1f4;--soluk:#a3adb8;--vurgu:#4fc3a8;--cizgi:#2c3742}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--yazi);font-family:"Segoe UI",system-ui,sans-serif}
main{max-width:1200px;margin:0 auto;padding:32px 24px}
h1{font-size:2.4rem;margin:0 0 4px}
.alt{color:var(--soluk);font-size:1.2rem;margin:0 0 32px}
h2{font-size:1.6rem;margin:28px 0 12px;color:var(--vurgu)}
.izgara{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
a.kart{display:block;background:var(--kart);border:2px solid var(--cizgi);border-radius:14px;
  padding:26px 22px;font-size:1.5rem;font-weight:600;color:var(--yazi);text-decoration:none;min-height:110px}
a.kart:hover,a.kart:focus{border-color:var(--vurgu);outline:none}
.bos{font-size:1.6rem;color:var(--soluk);margin-top:80px;text-align:center}
footer{margin-top:48px;color:var(--soluk);font-size:.95rem}
</style></head>
<body><main><h1>DKAB Ders Panosu</h1><p class='bos'>Şu anda yayında materyal yok.</p></main></body></html>
