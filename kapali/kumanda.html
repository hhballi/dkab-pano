<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pano">
<meta name="theme-color" content="#0f6b5c">
<title>Pano Kumanda</title>
<style>
:root{--bg:#f6f4ef;--kart:#fff;--yazi:#1f2a37;--soluk:#5b6675;--yesil:#0f6b5c;--kirmizi:#b3261e;--cizgi:#e2ddd2}
@media (prefers-color-scheme:dark){:root{--bg:#141a21;--kart:#1d2630;--yazi:#eef1f4;--soluk:#a3adb8;--yesil:#2e9e86;--kirmizi:#e0564d;--cizgi:#2c3742}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--yazi);font-family:"Segoe UI",system-ui,-apple-system,sans-serif}
main{max-width:480px;margin:0 auto;padding:28px 16px 40px}
h1{font-size:1.6rem;margin:0 0 4px}
.alt{color:var(--soluk);margin:0 0 22px}
#durum{background:var(--kart);border:2px solid var(--cizgi);border-radius:16px;padding:18px;text-align:center;margin-bottom:20px}
#durum b{display:block;font-size:1.7rem;margin-top:4px}
.dugme{display:block;width:100%;border:0;border-radius:20px;padding:30px 10px;font:inherit;font-size:2rem;font-weight:800;color:#fff;margin-bottom:16px;cursor:pointer}
.dugme:disabled{opacity:.5}
#ac{background:var(--yesil)} #kapat{background:var(--kirmizi)}
#mesaj{min-height:3em;text-align:center;color:var(--soluk);font-size:1.05rem}
details{margin-top:28px;background:var(--kart);border:1px solid var(--cizgi);border-radius:12px;padding:12px 14px}
summary{cursor:pointer;font-weight:600}
input{width:100%;font:inherit;padding:12px;border-radius:10px;border:1px solid var(--cizgi);background:var(--bg);color:var(--yazi);margin:10px 0}
.kucuk{font:inherit;padding:10px 14px;border-radius:10px;border:1px solid var(--cizgi);background:var(--bg);color:var(--yazi);cursor:pointer}
a{color:var(--yesil)}
</style></head>
<body><main>
<h1>Pano Kumanda</h1>
<p class="alt">DKAB Ders Panosu · hhballi.github.io/dkab-pano</p>
<div id="durum">Site şu an<b id="durumYazi">kontrol ediliyor…</b></div>
<button class="dugme" id="ac">AÇ</button>
<button class="dugme" id="kapat">KAPAT</button>
<div id="mesaj"></div>

<details id="ayar">
  <summary>Kurulum (bir kez)</summary>
  <p>GitHub'da oluşturduğunuz erişim anahtarını (token) buraya yapıştırın. Anahtar yalnızca bu telefonda saklanır.</p>
  <input id="anahtar" type="password" placeholder="github_pat_…" autocomplete="off">
  <button class="kucuk" id="kaydet">Kaydet</button>
  <button class="kucuk" id="sil">Anahtarı bu telefondan sil</button>
</details>
</main>
<script>
const REPO = "hhballi/dkab-pano", API = "https://api.github.com/repos/" + REPO;
const $ = id => document.getElementById(id);
const oku = () => { try { return localStorage.getItem("pano_anahtar") || ""; } catch (e) { return ""; } };
const yaz = v => { try { v ? localStorage.setItem("pano_anahtar", v) : localStorage.removeItem("pano_anahtar"); } catch (e) {} };
const mesaj = t => { $("mesaj").textContent = t; };

async function siteDurumu() {
  try {
    const r = await fetch("./?t=" + Date.now(), { cache: "no-store" });
    const t = await r.text();
    $("durumYazi").textContent = t.includes("class='bos'") ? "KAPALI" : "AÇIK";
    $("durumYazi").style.color = t.includes("class='bos'") ? "var(--kirmizi)" : "var(--yesil)";
  } catch (e) { $("durumYazi").textContent = "bilinmiyor"; }
}

async function gh(yol, secenek = {}) {
  return fetch(API + yol, { ...secenek, headers: {
    "Authorization": "Bearer " + oku(), "Accept": "application/vnd.github+json",
    "X-GitHub-Api-Version": "2022-11-28", ...(secenek.headers || {}) } });
}

async function calistir(dosya, ad) {
  if (!oku()) { $("ayar").open = true; mesaj("Önce aşağıdaki kurulumdan anahtarı kaydedin."); return; }
  $("ac").disabled = $("kapat").disabled = true;
  mesaj(ad + " komutu gönderiliyor…");
  try {
    // Saat farkından etkilenmemek için: komuttan önceki son işin numarasını al, daha yenisini bekle
    const once = await (await gh("/actions/workflows/" + dosya + "/runs?per_page=1")).json();
    const oncekiId = (once.workflow_runs && once.workflow_runs[0] && once.workflow_runs[0].id) || 0;
    const r = await gh("/actions/workflows/" + dosya + "/dispatches", { method: "POST", body: JSON.stringify({ ref: "main" }) });
    if (r.status === 401 || r.status === 403 || r.status === 404) { mesaj("Anahtar geçersiz ya da yetkisi yok (" + r.status + "). Kurulumu kontrol edin."); return; }
    if (r.status !== 204) { mesaj("Beklenmeyen yanıt: " + r.status); return; }
    mesaj(ad + " komutu alındı. GitHub çalıştırıyor…");
    for (let i = 0; i < 60; i++) {
      await new Promise(s => setTimeout(s, 3000));
      const j = await (await gh("/actions/workflows/" + dosya + "/runs?per_page=1")).json();
      const run = j.workflow_runs && j.workflow_runs[0];
      if (!run || run.id <= oncekiId) { mesaj(ad + ": GitHub başlatıyor… (" + (i + 1) * 3 + " sn)"); continue; }
      if (run.status !== "completed") { mesaj(ad + ": çalışıyor… (" + (i + 1) * 3 + " sn)"); continue; }
      if (run.conclusion === "success") {
        mesaj(ad + " tamam ✓  Siteye yansıması 1-2 dakika sürebilir.");
        // Durum takibi arka planda; düğmeler hemen kullanılabilir olsun
        (async () => { for (let k = 0; k < 12; k++) { await new Promise(s => setTimeout(s, 10000)); siteDurumu(); } })();
      } else mesaj(ad + " başarısız oldu (" + run.conclusion + "). Tekrar deneyin.");
      return;
    }
    mesaj("Uzun sürdü; GitHub'da takılmış olabilir. Birkaç dakika sonra durumu kontrol edin.");
  } catch (e) { mesaj("Bağlantı hatası: " + e.message); }
  finally { $("ac").disabled = $("kapat").disabled = false; siteDurumu(); }
}

$("ac").onclick = () => calistir("ac.yml", "AÇ");
$("kapat").onclick = () => calistir("kapat.yml", "KAPAT");
$("kaydet").onclick = () => { const v = $("anahtar").value.trim(); if (!v) return; yaz(v); $("anahtar").value = ""; $("ayar").open = false; mesaj("Anahtar kaydedildi. Artık AÇ / KAPAT kullanılabilir."); };
$("sil").onclick = () => { yaz(""); mesaj("Anahtar bu telefondan silindi."); };
if (!oku()) $("ayar").open = true;
siteDurumu();
</script>
</body></html>
